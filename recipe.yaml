context:
  version: "1.28.9"

recipe:
  name: mpds-gst
  version: ${{ version }}

source:
  - git: https://github.com/GStreamer/cerbero.git
    rev: 1.28.9
  - path: mpds.cbc

outputs:
  - staging:
      name: mpds-gst-build
    build:
      script:
        interpreter: bash
        content:
          - set -eu
          - export CERBERO_UNINSTALLED=1 PIP_NO_INDEX=false
          - if: win
            then: |
              export CI=true
              powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/bootstrap-windows.ps1 -VSVersion 2022
              MSYS2_ARG_CONV_EXCL='*' powershell.exe -NoProfile -ExecutionPolicy Bypass -Command '
                . ./tools/common.ps1
                Remove-Item Env:MSYS2_ARG_CONV_EXCL
                & "$(Get-MSYS2)\msys2_shell.cmd" -ucrt64 -defterm -no-start -here -use-full-path -lc "set -eu; ./cerbero-uninstalled -c mpds.cbc bootstrap --system=yes --assume-yes; mkdir -p build; ./cerbero-uninstalled -c mpds.cbc package --artifact tarball -o build gstreamer-1.0; ./cerbero-uninstalled -c mpds.cbc wipe --force --build-tools"
                exit $LASTEXITCODE
              '
            else: |
              cerbero() { ./cerbero-uninstalled -c mpds.cbc "$@"; }
              cerbero bootstrap --system=yes --assume-yes
              mkdir -p build
              cerbero package --artifact tarball -o build gstreamer-1.0
              cerbero wipe --force --build-tools

    requirements:
      build:
        - python 3.12.*
        - distro
        - git
        - if: win
          then: libarchive

  - package:
      name: mpds-gst
    inherit: mpds-gst-build
    build:
      dynamic_linking:
        rpaths:
          - lib/
          - lib64/
      script:
        interpreter: bash
        content:
          - set -eu
          - if: win
            then: prefix=$(cygpath -u "$LIBRARY_PREFIX")
            else: prefix=$PREFIX
          - mkdir -p "$prefix"
          - tar -xJf build/gstreamer-1.0-*-${{ version }}.tar.xz -C "$prefix"
    requirements:
      run_constraints:
        - gstreamer <0.0a0
        - gst-plugins-base <0.0a0
        - gst-plugins-good <0.0a0
        - gst-plugins-bad <0.0a0
        - gst-plugins-ugly <0.0a0
        - gst-libav <0.0a0
        - gst-plugins-rs <0.0a0
    tests:
      - script:
          - gst-inspect-1.0 --version
          - gst-inspect-1.0 --exists x264enc
          - gst-inspect-1.0 --exists x265enc
          - gst-inspect-1.0 --exists avdec_h264
          - gst-inspect-1.0 --exists avdec_h265
          - gst-inspect-1.0 --exists rav1enc
          - gst-inspect-1.0 --exists dav1ddec
          - gst-inspect-1.0 --exists avenc_ffv1
          - gst-inspect-1.0 --exists avdec_ffv1
          - gst-inspect-1.0 --exists jpegenc
          - gst-inspect-1.0 --exists jpegdec
          - gst-inspect-1.0 --exists pngenc
          - gst-inspect-1.0 --exists pngdec
          - gst-launch-1.0 -q videotestsrc num-buffers=4 ! videoconvert ! x264enc ! h264parse ! avdec_h264 ! fakesink
          - gst-launch-1.0 -q videotestsrc num-buffers=4 ! videoconvert ! rav1enc ! av1parse ! dav1ddec ! fakesink
      - if: linux
        then:
          - script:
              - gst-inspect-1.0 --exists --plugin video4linux2
              - gst-inspect-1.0 --exists --plugin va

  - package:
      name: mpds-gst-devel
    inherit: mpds-gst-build
    build:
      script:
        interpreter: bash
        content:
          - set -eu
          - if: win
            then: prefix=$(cygpath -u "$LIBRARY_PREFIX")
            else: prefix=$PREFIX
          - mkdir -p "$prefix"
          - tar -xJf build/gstreamer-1.0-*-${{ version }}-devel.tar.xz -C "$prefix"
    requirements:
      run:
        - ${{ pin_subpackage('mpds-gst', exact=True) }}
    tests:
      - script:
          - pkg-config --exact-version=${{ version }} gstreamer-1.0
        requirements:
          run:
            - pkg-config

about:
  summary: Conda runtime and development outputs from the upstream Cerbero GStreamer SDK
  homepage: https://gstreamer.freedesktop.org/
