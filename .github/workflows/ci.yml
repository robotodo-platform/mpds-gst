name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64:latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64:latest
          # TODO
          # - platform: win-64
          #   runner: windows-2022
          #   container: null
          # - platform: osx-64
          #   runner: macos-15-intel
          #   container: null
          # - platform: osx-arm64
          #   runner: macos-15
          #   container: null
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - name: Install Linux container prerequisites
        if: matrix.container != null
        shell: bash
        run: |
          dnf module enable -y nodejs:24
          dnf install -y sudo nodejs
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          run-install: false
      - name: Build and test packages
        shell: bash
        run: |
          pixi exec -c conda-forge --spec rattler-build rattler-build build \
            --experimental --recipe recipe.yaml --channel conda-forge \
            --target-platform ${{ matrix.platform }} --test native --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: mpds-gst-${{ matrix.platform }}
          path: dist/*/*.conda
          if-no-files-found: error
